if($('#gx'))$('#gx').onclick=()=>conf('¿Estás seguro?','Los invitados que aún no lo hayan visto ya no lo verán, y se cerrará a quienes lo tengan abierto.','Sí, dejar de mostrarlo',async()=>{await mapi({action:'clearPodium'}).catch(()=>{});mrefresh()});
$$('[data-n]').forEach(b=>b.onclick=()=>{const x=G.find(y=>y.id===b.dataset.n);conf('¿Estás seguro?',`A <b>${esc(x.nombre)}</b> le saldrá una advertencia que no podrá cerrar hasta que cambie su nombre.`,'Sí, obligar',async()=>{await mapi({action:'forceRename',id:x.id}).catch(()=>{});x.forzar=true;mdraw()})});
$$('[data-a]').forEach(b=>b.onclick=()=>{const x=G.find(y=>y.id===b.dataset.a);mdl(`<div class="px" style="font-size:10px;text-align:center;color:var(--sky)">Aviso para ${esc(x.nombre)}</div><textarea id="at" rows="3" maxlength="300" placeholder="Escribe el mensaje" style="margin-top:12px"></textarea><button class="btn" id="as">Enviar aviso</button>`);$('#as').onclick=async()=>{const t=$('#at').value.trim();if(!t)return;await mapi({action:'sendAviso',id:x.id,text:t}).catch(()=>{});cls();x.aviso=t;mdraw()}});
$$('[data-d]').forEach(b=>b.onclick=()=>{const x=G.find(y=>y.id===b.dataset.d);conf('Eliminar invitado',`¿Eliminar a <b>${esc(x.nombre)}</b>?`,'Sí, continuar',()=>conf('Confirmación final','Se borrará de Google Sheets. No se puede deshacer.','Eliminar definitivamente',async()=>{try{const r=await mapi({action:'deleteGuest',id:x.id});if(r.ok)MP.guests=MP.guests.filter(y=>y.id!==x.id)}catch(e){}mdraw()}))});
}

if(isAdmin)admin();else if(isMod)mod();else{swing();guest()}
</script></body></html>
